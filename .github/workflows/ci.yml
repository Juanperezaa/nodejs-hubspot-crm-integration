name: CI

# Runs the three secret-free verification layers described in docs/PLAN.md §8.
# Layers 4 and 5 (live portal probe, integration tests) require a private app
# token and are run locally; their output is attached to pull requests as
# evidence. No HubSpot credential is ever exposed to this public pipeline.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Lint, test and verify requirements
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: ['18.x', '20.x', '22.x']

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Strict mode: the build fails if any artefact the brief names is missing
      # or does not export what it should. Reporting mode was used while the
      # project was being built, so that CI stayed green across eight pull
      # requests and the matrix stayed readable; now that coverage is complete
      # the matrix is a gate rather than a progress bar.
      - name: Verify every required artefact exists
        run: npm run verify:requirements:strict

  commit-messages:
    name: Validate commit messages
    runs-on: ubuntu-latest
    # Only meaningful on pull requests, where a commit range exists.
    if: github.event_name == 'pull_request'

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint commits in this pull request
        run: >-
          npx commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

  secret-scan:
    name: Guard against committed credentials
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # A defence in depth against the single worst failure mode for this
      # project: leaking a portal credential into a public repository.
      - name: Fail if a HubSpot token pattern is present
        run: |
          if git grep -nIE 'pat-(na|eu)[0-9]?-[0-9a-f]{8}-' -- . ':!.env.example' ':!docs/**'; then
            echo "::error::A HubSpot access token pattern was found in tracked files."
            exit 1
          fi
          echo "No token patterns found in tracked files."

      - name: Fail if a .env file is tracked
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is tracked by git. It must be ignored."
            exit 1
          fi
          echo ".env is not tracked."
